<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App using HTML CSS and Javascript | Codehal</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="search_box">
            <i class='bx bxs-map'></i>
            <input type="text" placeholder="Enter you location">
            <button class="bx bx-search"></button>
        </div>

        <p class="city_hide">city hide</p>

        <div class="weather_box">
            <div class="box">
                <div class="info_weather">
                    <div class="weather">
                        <img src="images/cloud.png">
                        <p class="temprature">0<span></span>°C</p>
                        <p class="description">Broken Clouds</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="weather_details">
            <div class="humidity">
                <i class='bx bx-water'></i>
                <div class="text">
                    <div class="info_humidity">
                        <span>0%</span>
                    </div>
                    <p>Humidity</p>
                </div>
            </div>

            <div class="wind">
                <i class='bx bx-wind'></i>
                <div class="text">
                    <div class="info_wind">
                        <span>0Km/h</span>
                    </div>
                    <p>Wind Speed</p>
                </div>
            </div>
        </div>

        <div class="not_found">
            <div class="box">
                <img src="404.png">
                <p>Oops! Location not found!</p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
